<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button type="button" id="add-event-button">Добавить мероприятие</button>
    <main>
      <button type="button" id="add-event-button">Добавить мероприятие</button>
      <div id="window-form-event" class="window hidden">
        <div class="event-adding-form">
          <form data-testid="entity-form">
            <input type="number" name="id" placeholder="ID" required>
            <input type="text" name="title" placeholder="Название" required>
            <input type="date" name="date" placeholder="Дата мероприятия" required>
            <button type="submit">Добавить</button>
          </form>
        </div>
      </div>
      <div class="participant-adding-form hidden">
        <form data-testid="entity-form">
          <input type="number" name="id" placeholder="ID" required>
          <input type="text" name="title" placeholder="Название" required>
          <button type="submit">Добавить</button>
        </form>
      </div>
      <section
        data-testid="entity-list"
        aria-label="Список элементов"
      ></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
