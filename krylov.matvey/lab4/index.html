<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="event-adding-form">
      <button class="close-button-event-form" type="button">&times;</button>
      <h2>ДОБАВИТЬ МЕРОПРИЯТИЕ</h2>
      <form data-testid="entity-form" id="event-form">
        <input type="number" name="id" placeholder="ID" required />
        <input type="text" name="title" placeholder="НАЗВАНИЕ" required />
        <input type="date" name="date" required />
        <button type="submit">ДОБАВИТЬ</button>
      </form>
    </div>

    <div id="window-form-participant" class="window hidden">
      <div class="participant-adding-form">
        <button class="close-button-participant-form" type="button">
          &times;
        </button>
        <h2>ДОБАВИТЬ УЧАСТНИКА</h2>
        <form id="participant-form">
          <input
            type="number"
            name="eventID"
            placeholder="ID мероприятия"
            readonly
          />
          <input
            type="text"
            name="participantName"
            placeholder="ИМЯ УЧАСТНИКА"
            required
          />
          <button type="submit">ДОБАВИТЬ</button>
        </form>
      </div>
    </div>

    <main>
      <section
        data-testid="entity-list"
        aria-label="Список элементов"
      ></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
